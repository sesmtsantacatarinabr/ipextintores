<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Inspeção de Extintores</title>
    <!-- Biblioteca Chart.js para o Gráfico de Pizza -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #d32f2f;
            --success-color: #2e7d32;
            --warning-color: #f57c00;
            --dark-color: #333;
            --bg-color: #f4f6f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 24px;
            text-transform: uppercase;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            color: #fff;
        }

        .btn:hover { opacity: 0.8; }
        .btn-pdf { background-color: #1976d2; }
        .btn-add { background-color: var(--success-color); margin-bottom: 15px; }

        .info-section {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-group {
            flex: 1;
        }

        .info-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        .info-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .summary-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #666; }
        .card .value { font-size: 28px; font-weight: bold; }
        
        .card-total { border-top: 4px solid #1976d2; }
        .card-ok { border-top: 4px solid var(--success-color); }
        .card-ok .value { color: var(--success-color); }
        .card-nok { border-top: 4px solid var(--primary-color); }
        .card-nok .value { color: var(--primary-color); }

        .dashboard-content {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .table-container {
            flex: 3;
            min-width: 750px;
        }

        .chart-container {
            flex: 1;
            min-width: 300px;
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: var(--dark-color);
            color: #fff;
            padding: 12px 8px;
            text-align: left;
            font-size: 12px;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
            font-size: 13px;
        }

        select, input[type="date"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
        }

        .badge {
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            text-align: center;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }

        .badge-ok { background-color: var(--success-color); }
        .badge-nok { background-color: var(--primary-color); }
        .badge-warn { background-color: var(--warning-color); }
        .badge-pending { background-color: #9e9e9e; }

        /* Estilos específicos para Impressão / Exportação PDF */
        @media print {
            body { background-color: #fff; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .no-print { display: none !important; }
            input, select { 
                border: none; 
                appearance: none; 
                -moz-appearance: none; 
                -webkit-appearance: none; 
                background: transparent; 
                color: #000;
                font-weight: bold;
                padding: 0;
            }
            .chart-container { border: none; background: transparent; }
            td { padding: 4px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>🧯 Dashboard - Inspeção de Extintores</h1>
            <button class="btn btn-pdf no-print" onclick="window.print()">Exportar para PDF</button>
        </div>

        <!-- Campos Principais -->
        <div class="info-section no-print">
            <div class="info-group">
                <label>Responsável pela Inspeção:</label>
                <input type="text" placeholder="Nome do inspetor...">
            </div>
            <div class="info-group">
                <label>Data da Inspeção:</label>
                <input type="date" id="data-inspecao">
            </div>
        </div>

        <!-- Cards de Resumo -->
        <div class="summary-cards">
            <div class="card card-total">
                <h3>Total Inspecionado</h3>
                <div class="value" id="count-total">0</div>
            </div>
            <div class="card card-ok">
                <h3>Conformes (OK)</h3>
                <div class="value" id="count-ok">0</div>
            </div>
            <div class="card card-nok">
                <h3>Não Conformes (Vencidos / Despressurizados)</h3>
                <div class="value" id="count-nok">0</div>
            </div>
        </div>

        <!-- Área Principal: Tabela e Gráfico -->
        <div class="dashboard-content">
            
            <div class="table-container">
                <button class="btn btn-add no-print" onclick="addExtintor()">+ Adicionar Equipamento</button>
                
                <table id="extintores-table">
                    <thead>
                        <tr>
                            <th>Local</th>
                            <th>Modelo</th>
                            <th>Peso</th>
                            <th>Despressurizado?</th>
                            <th>Data Carga</th>
                            <th>Próxima Recarga</th>
                            <th>Status Final</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Linha Inicial Padrão -->
                        <tr>
                            <td>
                                <select>
                                    <option value="Estacionamento">Estacionamento</option>
                                    <option value="Loja">Loja</option>
                                    <option value="Depósito">Depósito</option>
                                </select>
                            </td>
                            <td>
                                <select onchange="atualizarDashboard()">
                                    <option value="Pó ABC">Pó ABC</option>
                                    <option value="Pó BC">Pó BC</option>
                                    <option value="CO2">CO2</option>
                                    <option value="Água">Água</option>
                                </select>
                            </td>
                            <td>
                                <select>
                                    <option value="4kg">4 kg</option>
                                    <option value="6kg">6 kg</option>
                                    <option value="10kg">10 kg</option>
                                    <option value="10L">10 Litros</option>
                                </select>
                            </td>
                            <td>
                                <select class="despressurizado-select" onchange="atualizarDashboard()">
                                    <option value="Não">Não</option>
                                    <option value="Sim">Sim</option>
                                </select>
                            </td>
                            <td>
                                <input type="date" class="data-carga" onchange="atualizarDashboard()">
                            </td>
                            <td class="col-recarga">---</td>
                            <td class="col-status"><span class="badge badge-pending">AGUARDANDO</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Gráfico de Pizza -->
            <div class="chart-container">
                <h3 style="margin-top: 0; color: #555;">Índice de Conformidade</h3>
                <div style="width: 250px; height: 250px;">
                    <canvas id="graficoPizza"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Seta a data de inspeção de hoje automaticamente
        document.getElementById('data-inspecao').valueAsDate = new Date();

        let meuGrafico;

        // Função para adicionar uma nova linha
        function addExtintor() {
            const tbody = document.querySelector("#extintores-table tbody");
            const tr = document.createElement("tr");
            
            tr.innerHTML = `
                <td>
                    <select>
                        <option value="Estacionamento">Estacionamento</option>
                        <option value="Loja">Loja</option>
                        <option value="Depósito">Depósito</option>
                    </select>
                </td>
                <td>
                    <select onchange="atualizarDashboard()">
                        <option value="Pó ABC">Pó ABC</option>
                        <option value="Pó BC">Pó BC</option>
                        <option value="CO2">CO2</option>
                        <option value="Água">Água</option>
                    </select>
                </td>
                <td>
                    <select>
                        <option value="4kg">4 kg</option>
                        <option value="6kg">6 kg</option>
                        <option value="10kg">10 kg</option>
                        <option value="10L">10 Litros</option>
                    </select>
                </td>
                <td>
                    <select class="despressurizado-select" onchange="atualizarDashboard()">
                        <option value="Não">Não</option>
                        <option value="Sim">Sim</option>
                    </select>
                </td>
                <td>
                    <input type="date" class="data-carga" onchange="atualizarDashboard()">
                </td>
                <td class="col-recarga">---</td>
                <td class="col-status"><span class="badge badge-pending">AGUARDANDO</span></td>
            `;
            
            tbody.appendChild(tr);
            atualizarDashboard();
        }

        // Função principal que calcula datas, status e atualiza o gráfico
        function atualizarDashboard() {
            let total = 0;
            let conformes = 0;
            let naoConformes = 0;
            
            let hoje = new Date();
            hoje.setHours(0, 0, 0, 0);

            const linhas = document.querySelectorAll("#extintores-table tbody tr");
            
            linhas.forEach(linha => {
                total++;
                let inputData = linha.querySelector('.data-carga').value;
                let despressurizado = linha.querySelector('.despressurizado-select').value;
                let colRecarga = linha.querySelector('.col-recarga');
                let colStatus = linha.querySelector('.col-status');

                if (inputData) {
                    // Evita problema de fuso horário lendo a data corretamente
                    let dataCarga = new Date(inputData + 'T00:00:00');
                    
                    // Calcula 1 ano de validade
                    let dataRecarga = new Date(dataCarga);
                    dataRecarga.setFullYear(dataCarga.getFullYear() + 1);
                    
                    // Mostra a data calculada na tabela
                    colRecarga.textContent = dataRecarga.toLocaleDateString('pt-BR');

                    let vencido = (dataRecarga < hoje);
                    let estaDespressurizado = (despressurizado === 'Sim');

                    // Regra de Negócio:
                    if (vencido && estaDespressurizado) {
                        naoConformes++;
                        colStatus.innerHTML = '<span class="badge badge-nok">VENCIDO E DESPRESSURIZADO</span>';
                    } else if (vencido) {
                        naoConformes++;
                        colStatus.innerHTML = '<span class="badge badge-nok">VENCIDO</span>';
                    } else if (estaDespressurizado) {
                        naoConformes++;
                        colStatus.innerHTML = '<span class="badge badge-warn">DESPRESSURIZADO</span>';
                    } else {
                        // Se não está vencido e não está despressurizado = OK
                        conformes++;
                        colStatus.innerHTML = '<span class="badge badge-ok">CONFORME</span>';
                    }
                } else {
                    colRecarga.textContent = '---';
                    colStatus.innerHTML = '<span class="badge badge-pending">AGUARDANDO DATA</span>';
                }
            });

            // Atualiza os Cards
            document.getElementById('count-total').textContent = total;
            document.getElementById('count-ok').textContent = conformes;
            document.getElementById('count-nok').textContent = naoConformes;

            // Atualiza o Gráfico
            renderizarGrafico(conformes, naoConformes);
        }

        // Função para desenhar o gráfico com Chart.js
        function renderizarGrafico(qtdConforme, qtdNaoConforme) {
            const ctx = document.getElementById('graficoPizza').getContext('2d');
            
            if (meuGrafico) {
                meuGrafico.destroy();
            }

            if (qtdConforme === 0 && qtdNaoConforme === 0) {
                meuGrafico = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['Aguardando Dados'],
                        datasets: [{ data: [1], backgroundColor: ['#e0e0e0'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
                return;
            }

            meuGrafico = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Conforme', 'Não Conforme (Vencido/Despress.)'],
                    datasets: [{
                        data: [qtdConforme, qtdNaoConforme],
                        backgroundColor: ['#2e7d32', '#d32f2f'], // Verde e Vermelho
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        // Inicializa o dashboard ao carregar
        window.onload = function() {
            atualizarDashboard();
        };
    </script>
</body>
</html>
